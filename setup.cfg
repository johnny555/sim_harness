# Setuptools configuration for the sim_harness Python package.
#
# After building and sourcing the workspace, the pytest plugin
# auto-loads via the ``pytest11`` entry point. To export Jama xlsx:
#
#   pytest --jama-xlsx out.xlsx [--jama-project KEY]

[metadata]
name = sim_harness
version = 1.0.0
description = Pytest plugin and helpers for ROS 2 simulation testing
author = John
author_email = john@example.com
license = Apache-2.0

[options]
packages = find:
zip_safe = True
install_requires = setuptools

[options.packages.find]
exclude = test*

[options.entry_points]
# Pytest plugins, auto-loaded whenever sim_harness is on the import path:
#   sim_harness_jama  — @pytest.mark.requirement marker + --jama-xlsx export
#   sim_harness_ros   — ros_node, message_collector_factory, gazebo_world fixtures
pytest11 =
    sim_harness_jama = sim_harness.pytest_jama_plugin
    sim_harness_ros  = sim_harness.pytest_ros_fixtures
